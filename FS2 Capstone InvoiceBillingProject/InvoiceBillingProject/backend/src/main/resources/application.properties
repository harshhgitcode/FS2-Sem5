spring.application.name=invoice-billing-api
server.port=8080
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/invoice_billing_saas}
app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-to-at-least-32-characters}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.origin=${APP_CORS_ORIGIN:http://localhost:5173}
spring.jackson.serialization.write-dates-as-timestamps=false
